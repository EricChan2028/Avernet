<text x="900" y="375" class="small">父楼 / 引用按需追溯</text>
<rect x="887" y="413" width="236" height="72" rx="8" fill="#fff7ed" stroke="#fb923c"/>
<text x="900" y="436" class="body" font-weight="700">触发楼层 #35（别人新回复）</text>
<text x="900" y="459" class="small">通知定位到这里</text>
<rect x="887" y="500" width="110" height="34" rx="17" fill="#ecfeff" stroke="#22d3ee"/><text x="942" y="522" text-anchor="middle" class="small">继续分页</text>
<rect x="1008" y="500" width="115" height="34" rx="17" fill="#ecfeff" stroke="#22d3ee"/><text x="1065" y="522" text-anchor="middle" class="small">追溯父楼/引用</text>
<text x="887" y="560" class="small">服务端组织关系和稳定分页，不替 Bot 总结整帖</text>

