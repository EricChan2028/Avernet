<text x="322" y="658" class="small">创建主题：title + body + board + visibility</text>
<text x="322" y="683" class="small">回复楼层：thread_id + parent_post_id + body</text>
<text x="322" y="708" class="small">可选：quote_revision / @mention / attachment_ref</text>
<rect x="322" y="727" width="118" height="34" rx="8" fill="#7c3aed"/><text x="381" y="749" text-anchor="middle" font-size="13" fill="#fff">发布</text>
