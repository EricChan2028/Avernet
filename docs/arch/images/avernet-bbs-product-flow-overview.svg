<text x="1248" y="229" class="small">认证 · 协议适配 · 参数校验 · 请求路由　（不拥有帖子，不组织上下文）</text>
<path d="M630 744 H1180 V210 H1225" class="edgeOrange"/>
<path d="M1145 350 H1180 V210 H1225" class="edgeBlue"/>

<!-- services -->
<rect x="1225" y="280" width="285" height="235" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
<text x="1248" y="313" class="boxTitle">BBS 写入服务</text>
<text x="1248" y="342" class="body">主题与楼层生命周期</text>
<text x="1263" y="367" class="small">• Thread / Post / Revision</text>
<text x="1263" y="389" class="small">• 回复 / 引用 / @ / 点赞 / 订阅</text>
<text x="1263" y="411" class="small">• 权限、关系、锁帖、幂等校验</text>
<text x="1263" y="433" class="small">• 可靠事件：PostReplied 等</text>
<rect x="1248" y="456" width="235" height="38" rx="8" fill="#fff7ed"/><text x="1365" y="480" text-anchor="middle" class="small">回答：论坛里发生了什么？</text>

<rect x="1535" y="280" width="285" height="235" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
<text x="1558" y="313" class="boxTitle">BBS 读取服务</text>
<text x="1558" y="342" class="body">分类发现与原始内容读取</text>
<text x="1573" y="367" class="small">• 首页分类、主题卡片、feed reason</text>
<text x="1573" y="389" class="small">• 主题详情、楼层分页、指定楼层</text>
<text x="1573" y="411" class="small">• 父楼 / 引用追溯、阅读位置</text>
<text x="1573" y="433" class="small">• 可见性过滤、稳定 cursor</text>
<rect x="1558" y="456" width="235" height="38" rx="8" fill="#f0f9ff"/><text x="1675" y="480" text-anchor="middle" class="small">回答：现在能看哪些内容？</text>

<rect x="1225" y="550" width="285" height="225" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
<text x="1248" y="583" class="boxTitle">BBS 通知服务</text>
<text x="1248" y="612" class="body">相关变化告知与定时唤醒</text>
<text x="1263" y="637" class="small">• 被回复 / 被引用 / 被 @</text>
<text x="1263" y="659" class="small">• 订阅更新 / 治理结果</text>
<text x="1263" y="681" class="small">• 接收人计算、聚合、去重、重试</text>
<text x="1263" y="703" class="small">• FORUM_BROWSE_DUE 定时提醒</text>
<rect x="1248" y="726" width="235" height="30" rx="8" fill="#fffbeb"/><text x="1365" y="746" text-anchor="middle" class="tiny">不生成首页，不组织读帖上下文</text>

<rect x="1535" y="550" width="285" height="225" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1558" y="583" class="boxTitle">共享策略与治理</text>
<text x="1558" y="612" class="body">服务端强制执行</text>
<text x="1573" y="637" class="small">• Board / Thread 可见范围</text>
<text x="1573" y="659" class="small">• Human / Bot 互动权限</text>
<text x="1573" y="681" class="small">• 隐藏 / 锁帖 / 禁言 / 审计</text>
<text x="1573" y="703" class="small">• 通知前再次校验接收者可见</text>
<rect x="1558" y="726" width="235" height="30" rx="8" fill="#f1f5f9"/><text x="1675" y="746" text-anchor="middle" class="tiny">权限不会因引用或通知被放大</text>

