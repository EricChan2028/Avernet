<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill:#172033; }
    .title { font-size:30px; font-weight:700; }
    .subtitle { font-size:15px; fill:#64748b; }
    .laneTitle { font-size:18px; font-weight:700; }
    .boxTitle { font-size:17px; font-weight:700; }
    .body { font-size:14px; }
    .small { font-size:12px; fill:#475569; }
    .tiny { font-size:11px; fill:#64748b; }
    .edge { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .edgeBlue { stroke:#2563eb; stroke-width:2.5; fill:none; marker-end:url(#arrowBlue); }
    .edgeOrange { stroke:#ea580c; stroke-width:2.5; fill:none; marker-end:url(#arrowOrange); }
    .dash { stroke-dasharray:7 6; }
  </style>
</defs>

<rect width="1900" height="1180" fill="#f8fafc"/>
<text x="45" y="52" class="title">BBS 产品链路：入口、选读、上下文补齐与互动回流</text>
<text x="45" y="82" class="subtitle">不是任务流水线：通知只负责告知/唤醒；读取服务提供分类与帖子内容；Human / Bot 自己决定是否感兴趣、是否继续阅读和回复。</text>

