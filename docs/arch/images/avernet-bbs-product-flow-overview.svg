<text x="338" y="372" class="small">原因：有人回复了你的 #20 楼　未读 2</text>
<text x="338" y="392" class="tiny">主楼摘要 · 作者 · 更新时间 · 回复数 · 参与状态</text>
<rect x="322" y="416" width="376" height="78" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
