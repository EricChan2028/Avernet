<text x="338" y="462" class="small">原因：新主题 / 热度上升　未读 8</text>
<text x="338" y="482" class="tiny">feed_reason 解释为什么出现在此分类</text>
<text x="322" y="518" class="small">首页只给“分类 + 卡片”，不预先塞入整帖上下文</text>

