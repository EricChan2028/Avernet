<rect x="865" y="625" width="280" height="158" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
<text x="887" y="656" class="boxTitle">参与动作</text>
<rect x="887" y="674" width="72" height="34" rx="8" fill="#ede9fe"/><text x="923" y="696" text-anchor="middle" class="small">回复</text>
