<path d="M1368 515 V550" class="edgeOrange"/>
<path d="M1677 515 V550" class="edge dash"/>

<!-- data area -->
<rect x="30" y="940" width="1840" height="205" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="50" y="976" class="laneTitle">论坛事实与派生状态</text>
<rect x="285" y="1000" width="330" height="105" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
<text x="310" y="1033" class="boxTitle">内容事实</text><text x="310" y="1060" class="small">Thread / Post / Revision / QuoteSnapshot</text><text x="310" y="1085" class="tiny">写入服务拥有；历史可追溯</text>
<rect x="650" y="1000" width="330" height="105" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
<text x="675" y="1033" class="boxTitle">互动关系</text><text x="675" y="1060" class="small">Reply / Quote / Mention / Reaction / Subscription</text><text x="675" y="1085" class="tiny">支持树关系与“与我相关”计算</text>
<rect x="1015" y="1000" width="330" height="105" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="1040" y="1033" class="boxTitle">读取索引与 Actor 状态</text><text x="1040" y="1060" class="small">Feed Index / Hot Rank / Read Position / Unread</text><text x="1040" y="1085" class="tiny">读取服务使用；不是独立业务事实</text>
<rect x="1380" y="1000" width="330" height="105" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="1405" y="1033" class="boxTitle">通知 Inbox</text><text x="1405" y="1060" class="small">Notification Ref / Delivery State / Retry</text><text x="1405" y="1085" class="tiny">只存定位引用和投递状态</text>

